spring.application.name=ontheway
spring.profiles.active=local
spring.jackson.time-zone=Asia/Seoul
# hibernate.jdbc.time_zone 은 두지 않는다. Instant/OffsetDateTime + timestamptz 용 옵션인데
# 우리는 전 컬럼이 LocalDateTime + timestamp 라, 켜두면 저장값이 (이 값 - JVM 기본 존)만큼
# 밀린다. 끄면 바인딩/조회 변환이 대칭이라 JVM 존과 무관해진다.
# JVM 존 자체는 OnthewayApplication.main() 에서 고정한다.