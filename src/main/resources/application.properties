spring.application.name=ontheway
spring.profiles.active=local
spring.jackson.time-zone=Asia/Seoul
# hibernate.jdbc.time_zone 은 일부러 안 넣는다. Instant, OffsetDateTime 을 timestamptz 에
# 넣을 때 쓰는 옵션인데, 여기는 전 컬럼이 LocalDateTime + timestamp 라 켜두면 저장값이
# JVM 기본 존만큼 밀린다. 끄면 저장과 조회 변환이 대칭이라 JVM 존을 타지 않는다.
# JVM 존 자체는 OnthewayApplication.main() 에서 고정한다.